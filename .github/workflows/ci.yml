# 単体テスト・アドオンのビルド・リリース（#8）
# - test: PR・リリースのタグ・手動実行のとき。素材（char/）と VOICEVOX エンジンは無いので、それを使うテストは skip になる
# - build / release: v で始まるタグ（例 v0.2.0）を push したときだけ、Linux 版 Blender で OS ごとの zip を作り、
#   その zip で GitHub のリリースを作る。タグは blender_manifest.toml の version と同じにする
name: CI

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.2.2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: タグと manifest の version が同じか確かめる
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' blender_addon/blender_manifest.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と blender_manifest.toml の version $version が違います"
            exit 1
          fi
      - name: Blender を取ってくる
        id: blender-cache
        uses: actions/cache@v6
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          minor=${BLENDER_VERSION%.*}
          curl -sSfL "https://download.blender.org/release/Blender$minor/blender-$BLENDER_VERSION-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1
      - name: Blender が使うライブラリ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-6 libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - run: uv sync --locked
      - run: BLENDER="$HOME/blender/blender" uv run python scripts/build_addon.py
      - uses: actions/upload-artifact@v7
        with:
          name: blender_tachie
          path: dist/blender_tachie-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blender_tachie
          path: dist
      # 再実行（アップロードの途中で落ちたときなど）でリリースが既にあれば、zip だけ差し替える
      - run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
