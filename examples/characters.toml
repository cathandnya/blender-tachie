# キャラクター設定の例。folder はこのファイルからの相対パス。
# speaker は VOICEVOX のスタイル ID（uv run python -m tachie_studio.lipsync --speakers で一覧）。
# mouth: auto（母音画像があればあいうえお式、なければ音量式）/ vowel / volume
# 日本語のキーは TOML の決まりで "" で囲む。
# 声の調整（省略可）: speed pitch intonation volume pre_phoneme post_phoneme pause
# 音声（省略可）: ["キャラ".audio] に volume pan fade_in fade_out after（セリフ後の余韻、秒）

["ずんだもん"]
folder = "../char/ずんだもん"
speaker = 3
mouth = "auto"

["ずんだもん".parts]
"眉" = "普通眉"
"目" = "普通白目_カメラ目線"
"口" = "むふ"
"顔色" = "ほっぺ"
"他" = ["左腕_基本", "右腕_基本"]  # YMM4 の並び: 他1 = 左腕、他2 = 右腕

# 表情プリセット。基本の表情から変えるパーツだけ書く。台本では「ずんだもん(困り): セリフ」
["ずんだもん".expressions."困り"]
"眉" = "困り眉1"
"目" = "ジト目"
"顔色" = "青ざめ"
"他" = ["左腕_口元", "右腕_口元", "記号_汗1"]

["ずんだもん".expressions."ドヤ"]
"眉" = "上がり眉"
"目" = "にっこり"
"他" = ["左腕_腰", "右腕_腰"]

["四国めたん"]
folder = "../char/四国めたん"
speaker = 2
mouth = "vowel"

["四国めたん".parts]
"眉" = "ごきげん"
"目" = "普通白目_カメラ目線"
"口" = "ほほえみ"
"髪" = "ヘッドドレス"
"顔色" = "普通"
"体" = "白ロリ服"
"他" = ["左腕_普通", "右腕_普通"]

["四国めたん".subtitle]
outline_color = [0.75, 0.2, 0.5, 1.0]
outline_width = 0.2

["四国めたん".layout]
position = -0.28
flip = true

["四国めたん".expressions."おこ"]
"眉" = "おこ"
"顔色" = "赤面"
"他" = ["左腕_普通", "右腕_指差す"]
