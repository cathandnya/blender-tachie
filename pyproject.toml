[project]
name = "blender-tachie"
version = "0.1.0"
description = "Talking character (tachie) add-on for Blender's Video Sequencer, with VOICEVOX lip sync. Also reads YMM4 moving tachie materials."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "brotli>=1.2.0",
    "budoux>=0.10.2",
    "pillow",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tachie_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
