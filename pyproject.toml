[project]
name = "blender-ymm-addon"
version = "0.1.0"
description = "YMM4-style talking characters, subtitles and VOICEVOX for Blender's Video Sequencer"
requires-python = ">=3.13"
dependencies = ["pillow"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ymm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
