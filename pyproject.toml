[project]
name = "blender-tachie"
version = "0.1.0"
description = "VOICEVOX voices, lip-synced talking characters and subtitles for Blender's Video Sequencer"
requires-python = ">=3.13"
dependencies = ["pillow"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tachie_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
